<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" preserveAspectRatio="xMidYMax slice">
  <!-- Gizmo's discovery lab (29 Oct 2026): a calm lavender sea floor in the soft painted style.
       Everything sits at the edges and along the bottom so photos and answers in the middle stay
       the clearest thing on screen. -->
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3eaf3"/>
      <stop offset=".6" stop-color="#e9dcea"/>
      <stop offset="1" stop-color="#dccfe3"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1e5d0"/>
      <stop offset="1" stop-color="#e2d0b2"/>
    </linearGradient>
    <linearGradient id="sandBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3d6e4"/>
      <stop offset="1" stop-color="#d8cada"/>
    </linearGradient>
    <radialGradient id="kelp" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#d6b8e2"/><stop offset=".6" stop-color="#b48ac8"/><stop offset="1" stop-color="#9670ad"/>
    </radialGradient>
    <radialGradient id="kelpG" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#b5dcc0"/><stop offset=".6" stop-color="#8cc19c"/><stop offset="1" stop-color="#70a682"/>
    </radialGradient>
    <radialGradient id="coral" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#ffd0c4"/><stop offset=".6" stop-color="#f2a593"/><stop offset="1" stop-color="#d9846f"/>
    </radialGradient>
    <radialGradient id="sub" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fff0b8"/><stop offset=".6" stop-color="#f2c14e"/><stop offset="1" stop-color="#cf972a"/>
    </radialGradient>
    <radialGradient id="glass" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".6" stop-color="#d8f1f6" stop-opacity=".55"/><stop offset="1" stop-color="#9fd3e0" stop-opacity=".5"/>
    </radialGradient>
    <radialGradient id="wood" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#d9a877"/><stop offset=".6" stop-color="#b9824e"/><stop offset="1" stop-color="#8f5f34"/>
    </radialGradient>
    <radialGradient id="crab" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#ffb3a2"/><stop offset=".6" stop-color="#ee6f55"/><stop offset="1" stop-color="#c24f39"/>
    </radialGradient>
    <radialGradient id="jelly" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fdf2ff"/><stop offset=".6" stop-color="#e6c2f0"/><stop offset="1" stop-color="#c49ad8"/>
    </radialGradient>
    <radialGradient id="shell" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#fff3ea"/><stop offset="1" stop-color="#f0c4ad"/>
    </radialGradient>
    <radialGradient id="star" cx=".35" cy=".3" r=".9">
      <stop offset="0" stop-color="#ffd2b0"/><stop offset="1" stop-color="#ec9c6c"/>
    </radialGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".9"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="840" fill="url(#water)"/>
  <path d="M170 0H260L120 840H-20Z M520 0H570L470 840H380Z M840 0H930L900 840H760Z" fill="url(#ray)" opacity=".7"/>

  <!-- soft ripples near the top -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6">
    <path d="M80 70Q110 54 140 70T200 70"/>
    <path d="M980 100Q1010 84 1040 100T1100 100"/>
  </g>

  <!-- a friendly jellyfish drifting top-right -->
  <g transform="translate(1110 120) scale(.8)">
    <g fill="none" stroke="#c49ad8" stroke-width="4" stroke-linecap="round" opacity=".8">
      <path d="M-22 6Q-28 30 -18 56M-8 8Q-12 36 -2 62M8 8Q12 36 2 62M22 6Q28 30 18 56"/>
    </g>
    <path d="M-38 8Q-38 -34 0 -34Q38 -34 38 8Q28 4 18 8Q8 3 0 8Q-8 3 -18 8Q-28 4 -38 8Z" fill="url(#jelly)" stroke="#a678be" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="-10" cy="-10" r="3" fill="#4f3550"/><circle cx="10" cy="-10" r="3" fill="#4f3550"/>
    <path d="M-5 -2Q0 2 5 -2" fill="none" stroke="#4f3550" stroke-width="2" stroke-linecap="round"/>
    <path d="M-26 -12Q-20 -26 -6 -27" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85"/>
  </g>

  <!-- far sand and kelp -->
  <path d="M0 660Q200 630 420 650T840 640T1200 630V840H0Z" fill="url(#sandBack)"/>
  <g fill="#cdb8d6" opacity=".7">
    <path d="M300 660Q286 610 306 576Q320 550 310 520Q332 550 328 584Q322 620 328 660Z"/>
    <path d="M900 650Q888 600 906 568Q920 540 910 512Q932 540 928 574Q922 610 928 650Z"/>
  </g>

  <!-- near sand -->
  <path d="M0 730Q240 700 520 722T1000 716T1200 708V840H0Z" fill="url(#sand)"/>
  <g fill="#d6c19a" opacity=".5">
    <ellipse cx="360" cy="790" rx="30" ry="4"/><ellipse cx="760" cy="800" rx="36" ry="4"/>
  </g>

  <!-- left: kelp, a giant magnifying glass in the sand, rocks and a curious crab -->
  <g stroke-linejoin="round" stroke-width="2.6">
    <path d="M40 760Q10 640 48 556Q80 488 56 400Q106 470 94 556Q80 650 90 760Z" fill="url(#kelp)" stroke="#7d5a93"/>
    <path d="M98 768Q86 690 110 640Q130 600 118 556Q148 596 142 644Q134 700 138 768Z" fill="url(#kelpG)" stroke="#5f8f6c"/>
  </g>
  <g transform="translate(250 660) rotate(-24)">
    <path d="M-9 70L-9 150Q0 160 9 150L9 70Z" fill="url(#wood)" stroke="#6b4426" stroke-width="2.4"/>
    <circle cx="0" cy="0" r="74" fill="url(#glass)"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="#5c6a78" stroke-width="12"/>
    <circle cx="0" cy="0" r="74" fill="none" stroke="#b4c0ca" stroke-width="4"/>
    <path d="M-44 -30Q-30 -54 -4 -60" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <rect x="-14" y="66" width="28" height="14" rx="4" fill="#8796a3" stroke="#5c6a78" stroke-width="2"/>
  </g>
  <g stroke-linejoin="round" stroke-width="2.6">
    <path d="M150 772Q140 730 170 716Q196 704 220 722Q236 744 228 772Z" fill="#b8a9bf" stroke="#86769a"/>
    <path d="M120 780Q118 760 136 754Q150 752 156 766Q160 780 156 784Z" fill="#c8bccf" stroke="#86769a"/>
  </g>
  <!-- the crab, peeking at the magnifying glass -->
  <g transform="translate(370 772)">
    <ellipse cx="0" cy="12" rx="34" ry="5" fill="#4f3550" opacity=".14"/>
    <g fill="none" stroke="#c24f39" stroke-width="4" stroke-linecap="round">
      <path d="M-16 4L-30 10L-36 18M-12 8L-24 16L-26 24M16 4L30 10L36 18M12 8L24 16L26 24"/>
      <path d="M-16 -6L-28 -18M16 -6L28 -18"/>
    </g>
    <path d="M-34 -18Q-46 -28 -38 -38L-32 -30L-26 -40Q-16 -30 -28 -20Q-31 -16 -34 -18Z" fill="url(#crab)" stroke="#a5402d" stroke-width="2"/>
    <path d="M34 -18Q46 -28 38 -38L32 -30L26 -40Q16 -30 28 -20Q31 -16 34 -18Z" fill="url(#crab)" stroke="#a5402d" stroke-width="2"/>
    <path d="M-8 -12V-24M8 -12V-24" stroke="#d65a43" stroke-width="3.4" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="26" ry="15" fill="url(#crab)" stroke="#a5402d" stroke-width="2.2"/>
    <circle cx="-8" cy="-26" r="4.5" fill="#fff"/><circle cx="-8" cy="-26" r="3" fill="#22313b"/>
    <circle cx="8" cy="-26" r="4.5" fill="#fff"/><circle cx="8" cy="-26" r="3" fill="#22313b"/>
    <path d="M-6 4Q0 8 6 4" fill="none" stroke="#7a2a20" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- right: Gizmo's little research submarine resting on the sand, lamp glowing -->
  <g transform="translate(800 700) scale(.9)">
    <ellipse cx="0" cy="58" rx="120" ry="10" fill="#4f3550" opacity=".14"/>
    <path d="M-70 50L-80 64M70 50L80 64" stroke="#7a6a7e" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-150" cy="10" r="58" fill="url(#lamp)" opacity=".8"/>
    <path d="M-10 -36V-70H20V-82" fill="none" stroke="#cf972a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-104 6Q-104 -40 -40 -40H60Q118 -40 118 4Q118 50 60 50H-40Q-104 50 -104 6Z" fill="url(#sub)" stroke="#a87418" stroke-width="3"/>
    <path d="M118 -10L140 -26V36L118 20Z" fill="#c98f22" stroke="#a87418" stroke-width="2.6" stroke-linejoin="round"/>
    <circle cx="-50" cy="4" r="20" fill="#9fd8e6" stroke="#8a6a3a" stroke-width="5"/>
    <circle cx="10" cy="4" r="20" fill="#9fd8e6" stroke="#8a6a3a" stroke-width="5"/>
    <circle cx="70" cy="4" r="16" fill="#9fd8e6" stroke="#8a6a3a" stroke-width="4.5"/>
    <path d="M-58 -4Q-54 -12 -46 -12M2 -4Q6 -12 14 -12M64 -4Q67 -10 74 -10" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M-104 6L-122 6" stroke="#8796a3" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-126" cy="6" r="9" fill="#fff6c8" stroke="#cf972a" stroke-width="2.4"/>
    <path d="M-84 -18Q-70 -34 -40 -34" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  </g>
  <g stroke-linejoin="round" stroke-width="2.6">
    <path d="M1110 760Q1090 650 1122 580Q1148 520 1130 450Q1176 510 1166 586Q1156 670 1162 760Z" fill="url(#kelp)" stroke="#7d5a93"/>
    <path d="M1060 774Q1054 726 1076 712Q1080 738 1094 730Q1092 700 1110 688Q1126 726 1118 774Z" fill="url(#coral)" stroke="#b56a58"/>
  </g>

  <!-- shells and a starfish on the sand -->
  <g stroke-linejoin="round" stroke-width="2">
    <path d="M560 794q-2-22 18-24q20 2 18 24z" fill="url(#shell)" stroke="#c99a88"/>
    <path d="M570 792l-3-16M578 792v-20M586 792l3-16" stroke="#c99a88" fill="none" stroke-linecap="round"/>
    <path d="M700 772l6 12 13 2-10 9 3 13-12-6-12 6 3-13-10-9 13-2z" fill="url(#star)" stroke="#c97d55"/>
  </g>

  <!-- bubbles -->
  <g fill="#fff" fill-opacity=".4" stroke="#fff" stroke-opacity=".85" stroke-width="1.5">
    <circle cx="70" cy="360" r="8"/><circle cx="88" cy="320" r="5"/><circle cx="64" cy="290" r="4"/>
    <circle cx="1040" cy="560" r="7"/><circle cx="1054" cy="526" r="4.5"/><circle cx="1036" cy="498" r="3.5"/>
  </g>
</svg>
