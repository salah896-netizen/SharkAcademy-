<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#073f51" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shark Academy" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="premium.css" />
    <link rel="stylesheet" href="shark-school.css" />
    <link rel="stylesheet" href="milo.css" />
    <link rel="stylesheet" href="visual-play.css" />
    <link rel="stylesheet" href="ocean-worlds.css" />
    <link rel="stylesheet" href="crew.css" />
    <link rel="stylesheet" href="band.css" />
    <link rel="stylesheet" href="ocean-titles.css" />
    <link rel="stylesheet" href="reading-adventure.css" />
    <title>Haytham’s Shark Academy</title>
    <link rel="stylesheet" href="ocean-experience.css" />
    <link rel="stylesheet" href="calm-scenes.css" />
    <link rel="stylesheet" href="hands-on-sharing.css" />
  </head>
  <body>
    <div
      id="launchScreen"
      class="launch-screen"
      role="status"
      aria-live="polite"
      aria-label="Loading Shark Academy"
    >
      <div id="launchMilo"></div>
      <p>Diving in<span class="launch-dots">…</span></p>
    </div>
    <div id="oceanWorld" aria-hidden="true">
      <div class="world-backdrop" id="world0"></div>
      <div class="world-backdrop" id="world1"></div>
      <div id="livingOcean"></div>
    </div>
    <header>
      <a href="#home" class="brand"
        ><span id="brandMilo" class="brand-milo" aria-label="Milo with his explorer monocle"></span>
        <div>HAYTHAM’S<small>SHARK ACADEMY</small></div></a
      >
      <div class="header-right">
        <button id="music" class="quiet" aria-label="Start adventure music" aria-pressed="true">
          ♫ Play</button
        ><span id="offline" class="status">Preparing offline pack…</span
        ><button class="quiet" id="sound" aria-label="Toggle voice">Voice on ♫</button
        ><button class="quiet" id="parent">Parents ⚙</button>
      </div>
    </header>
    <main id="app"></main>
    <aside id="miloCompanion" class="milo-companion" hidden></aside>
    <nav aria-label="Main navigation">
      <a href="#museum"
        ><svg
          viewBox="0 0 32 32"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M2 16Q7 8 15 11L18 4L20 12L25 14L30 7L28 16L30 23L24 19Q10 26 2 16ZM8 15h.1"
          /></svg
        ><span>Sharks</span></a
      ><a href="#expeditions"
        ><svg
          viewBox="0 0 32 32"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M7 12H22A6 6 0 0 1 22 24H7A6 6 0 0 1 7 12ZM12 12V6H18M26 14L31 11V25L26 22M9 18h.1M16 18h.1"
          /></svg
        ><span>Learn</span></a
      ><a href="#home" class="reef-nav" aria-label="My Reef"
        ><svg
          viewBox="0 0 32 32"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M2 25Q8 20 15 25T30 25M9 22V7M9 15L3 10M9 12L15 6M21 22V10M21 16L27 11M18 6h.1M27 4h.1"
          /></svg
        ><span>My Reef</span></a
      ><a href="#writing"
        ><svg
          viewBox="0 0 32 32"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M16 26L5 16Q0 7 8 5Q13 1 16 5Q22 1 27 7Q32 11 27 17ZM16 25V7M16 25L8 9M16 25L25 9"
          /></svg
        ><span>Writing</span></a
      ><a href="#stories"
        ><svg
          viewBox="0 0 32 32"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M4 7Q10 3 16 7Q23 3 28 7V26Q22 22 16 26Q10 22 4 26ZM16 7V26M7 29Q12 27 16 29Q22 27 27 29"
          /></svg
        ><span>Stories</span></a
      >
    </nav>
    <a
      id="cinemaShell"
      class="cinema-shell-egg"
      href="#cinema"
      aria-label="Discover Shark Cinema"
      title="Shark Cinema"
      ><svg viewBox="0 0 100 95" aria-hidden="true">
        <defs>
          <linearGradient id="shellEgg" x2=".8" y2="1">
            <stop stop-color="#f7efdc" />
            <stop offset=".45" stop-color="#b9e5e3" />
            <stop offset=".75" stop-color="#cbbce6" />
            <stop offset="1" stop-color="#f2deb4" />
          </linearGradient>
        </defs>
        <path
          d="M50 84L12 53C-2 26 18 12 30 22C31 3 49 2 50 19C61 0 77 9 74 23C94 10 106 35 87 55Z"
          fill="url(#shellEgg)"
          stroke="#eed9a7"
          stroke-width="2"
        />
        <path
          d="M50 82V24M50 82L26 26M50 82L77 28"
          fill="none"
          stroke="#fff7e6"
          stroke-opacity=".6"
          stroke-width="2"
        />
        <rect x="30" y="38" width="34" height="24" rx="6" fill="#184b60" />
        <path d="M64 45L78 38V64L64 57Z" fill="#184b60" />
        <circle cx="45" cy="50" r="6" fill="none" stroke="#d9eee4" stroke-width="2" />
        <path d="M45 77Q50 82 56 77" stroke="#d4b777" stroke-width="3" fill="none" /></svg
    ></a>
    <dialog id="modal">
      <div id="modalContent"></div>
      <button class="quiet" id="closeModal">Close</button>
    </dialog>
    <script src="shark-school.js"></script>
    <script src="encyclopedia.js"></script>
    <script src="writing.js"></script>
    <script src="recorded-voices.js"></script>
    <script src="companion.js"></script>
    <script src="learning.js"></script>
    <script src="stories.js"></script>
    <script src="reef-play.js"></script>
    <script src="atmosphere.js"></script>
    <script src="secrets.js"></script>
    <script src="crew.js"></script>
    <script src="reading-adventure.js"></script>
    <script src="app.js"></script>
    <script src="ocean-experience.js"></script>
    <script src="lesson-pack.js"></script>
    <script src="hands-on-sharing.js"></script>
    <script src="calm-scenes.js"></script>
  </body>
</html>
